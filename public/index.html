<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnkiScape Hiscores</title>
  <meta name="description" content="Read-only Hiscores for AnkiScape: username, level and XP.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preload" href="/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#board">Skip to the board</a>
  <header class="top">
    <h1>AnkiScape Hiscores</h1>
    <p class="lede">Read-only. Play in Anki to appear here.</p>
    <p class="updated" id="updated" aria-live="polite"></p>
  </header>

  <main id="main">
    <div class="controls">
      <div class="tabs" role="tablist" aria-label="Board" id="tabs"></div>
      <div class="sort" id="sort-row" hidden>
        <span class="sort-label" id="sort-label">Rank by</span>
        <div role="group" aria-labelledby="sort-label" class="sort-group">
          <button type="button" class="seg" id="sort-xp" aria-pressed="true">Total XP</button>
          <button type="button" class="seg" id="sort-level" aria-pressed="false">Total level</button>
        </div>
      </div>
    </div>

    <section id="board" class="board" role="tabpanel" tabindex="-1" aria-labelledby="board-title" aria-busy="true">
      <h2 id="board-title" class="board-title">Overall</h2>
      <div id="banner" class="banner" role="status" hidden></div>
      <div id="body"></div>
      <p class="note" id="note"></p>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="refresh">Refresh</button>
    </div>
  </main>

  <footer class="foot">
    <p>Shows the same username, level and XP as the Hiscores inside the AnkiScape add-on for Anki. Nothing on this page is written back, and no personal details are shown.</p>
  </footer>
</body>
</html>
